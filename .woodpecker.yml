# Woodpecker CI for the Local-First fork. The pipeline triggers on
# `pull_request` only — every check that can fail must gate the PR,
# because a broken `main` is worse than a delayed merge. Five steps
# run in order; each gates the next on success. The full
# `@open-design/daemon` test surface (>5 min on this machine; 17
# pre-existing failures slow it further) stays local via
# `pnpm --filter @open-design/daemon test` — the PR-feedback path
# runs only the focused `origin-validation` subset for fast,
# deterministic gating.
#
# No `pnpm build` on PR — full builds stay local via
# `pnpm tools-dev run web`. The repo's `pnpm guard` policy floor is
# the source of truth for cross-cutting checks; add new gates to
# `scripts/guard.ts` first, then mirror them in the matching
# Woodpecker step.
#
# Migration context: `.github/workflows/` is kept as a transitional
# mirror while Woodpecker stabilizes (see root `AGENTS.md` §
# "GitHub automation boundary"). Removal of the GH Actions surface
# is a follow-up decision.
#
# Note on pnpm installation: every step installs pnpm via
# `npm install -g pnpm@10.33.2`. Woodpecker steps run in fresh
# containers, so per-step install is required. The earlier
# `corepack enable && corepack prepare pnpm@10.33.2 --activate`
# approach failed at runtime: corepack creates shims in
# `~/.cache/node/corepack/v1/`, but that directory is not in the
# default `PATH` for the non-interactive `sh` shell that the step
# command runner uses, so subsequent `pnpm` invocations error with
# "pnpm: not found". The npm-global install puts pnpm in
# `/usr/local/bin/`, which IS in PATH.

when:
  - event: pull_request

steps:
  install:
    name: install
    image: node:24-alpine
    environment:
      CI: "true"
    commands:
      - apk add --no-cache python3 make g++ git
      - npm install -g pnpm@10.33.2
      - pnpm install --frozen-lockfile

  guard:
    name: policy guard
    image: node:24-alpine
    depends_on: [install]
    commands:
      - apk add --no-cache python3 make g++ git
      - npm install -g pnpm@10.33.2
      - pnpm guard

  typecheck:
    name: typecheck
    image: node:24-alpine
    depends_on: [install]
    commands:
      - apk add --no-cache python3 make g++ git
      - npm install -g pnpm@10.33.2
      - pnpm typecheck

  test-contracts:
    name: contracts tests
    image: node:24-alpine
    depends_on: [install]
    commands:
      - apk add --no-cache python3 make g++ git
      - npm install -g pnpm@10.33.2
      - pnpm --filter @open-design/contracts test

  test-daemon:
    name: daemon tests (focused)
    image: node:24-alpine
    depends_on: [install]
    commands:
      - apk add --no-cache python3 make g++ git
      - npm install -g pnpm@10.33.2
      # Focused deterministic subset for PR feedback. The full daemon
      # test surface stays local via `pnpm --filter @open-design/daemon test`
      # and is part of the merge gate (developer runs it locally
      # before pushing). A nightly cron job against `main` tip is a
      # follow-up — out of scope for this initial Woodpecker setup.
      - pnpm --filter @open-design/daemon test tests/origin-validation.test.ts
